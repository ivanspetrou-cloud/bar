[package]
name = "bar-agent"
version = "0.1.0"
edition = "2021"
description = "Bar: системные данные Windows (звук, медиа, окна) — замена PowerShell-агента"

[dependencies]
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
