[package]
name = "bar-tauri"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bar на Tauri: тот же интерфейс (src/ui), главный процесс на Rust вместо Electron"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bar-agent = { path = "../native/agent" }
webview2-com = "0.39"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
png = "0.18"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_SystemInformation",
  "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi",
  "Win32_Security", "Win32_Security_Cryptography", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole",
  "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Shutdown", "Win32_System_Registry",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
