[package]
name = "bar-tauri"
version = "0.1.0"
edition = "2021"
publish = false
description = "Bar на Tauri: тот же интерфейс (src/ui), главный процесс на Rust вместо Electron"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bar-agent = { path = "../native/agent" }
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_SystemInformation",
  "Win32_System_Power", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_HiDpi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
